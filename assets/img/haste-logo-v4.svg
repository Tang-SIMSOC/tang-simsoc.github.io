<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 20 524 600" role="img" aria-labelledby="title desc">
  <title id="title">HASTE project logo</title>
  <desc id="desc">A pale-yellow hexagonal badge patterned with online-chat symbols. Two inset speech bubbles form a three-turn double helix that ends in opposing arrows.</desc>

  <defs>
    <pattern id="chat-symbols" width="104" height="82" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <g fill="#b98b25" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.14">
        <text x="10" y="27" font-size="19">@</text>
        <text x="65" y="23" font-size="16">#</text>
        <text x="24" y="65" font-size="17">...</text>
        <text x="83" y="67" font-size="18">!</text>
      </g>
    </pattern>
  </defs>

  <path d="M320 42 560 180v280L320 598 80 460V180Z" fill="#fff3c9"/>
  <path d="M320 42 560 180v280L320 598 80 460V180Z" fill="url(#chat-symbols)"/>

  <g aria-label="online dialogue">
    <rect x="152" y="150" width="160" height="108" rx="24" fill="#2364aa"/>
    <rect x="328" y="150" width="160" height="108" rx="24" fill="#d64045"/>

    <g fill="#ffffff">
      <rect x="168" y="178" width="124" height="10" rx="5"/>
      <rect x="168" y="202" width="94" height="10" rx="5"/>
      <rect x="168" y="226" width="114" height="10" rx="5"/>

      <rect x="348" y="178" width="124" height="10" rx="5"/>
      <rect x="378" y="202" width="94" height="10" rx="5"/>
      <rect x="358" y="226" width="114" height="10" rx="5"/>
    </g>
  </g>

  <g aria-label="DNA-like interaction and negative influence" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 246 C258 266 382 266 382 286 C382 306 258 306 258 326 C258 346 382 346 382 366 C382 386 300 392 218 392"
          stroke="#fff3c9" stroke-width="30"/>
    <path d="M382 246 C382 266 258 266 258 286 C258 306 382 306 382 326 C382 346 258 346 258 366 C258 386 340 392 422 392"
          stroke="#fff3c9" stroke-width="30"/>

    <path d="M286 268H354M286 308H354M286 348H354" stroke="#202733" stroke-width="7" opacity="0.82"/>

    <path d="M258 246 C258 266 382 266 382 286 C382 306 258 306 258 326 C258 346 382 346 382 366 C382 386 300 392 218 392"
          stroke="#2364aa" stroke-width="17"/>
    <path d="M382 246 C382 266 258 266 258 286 C258 306 382 306 382 326 C382 346 258 346 258 366 C258 386 340 392 422 392"
          stroke="#d64045" stroke-width="17"/>
  </g>

  <path d="M222 369 176 392 222 415Z" fill="#2364aa"/>
  <path d="M418 369 464 392 418 415Z" fill="#d64045"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="464" font-size="56" font-weight="800" fill="#202733">HASTE</text>
    <text x="320" y="492" font-size="12.5" font-weight="700" fill="#d64045">HATE-SPEECH, AFFECT &amp;</text>
    <text x="320" y="511" font-size="12.5" font-weight="700" fill="#2364aa">SOCIAL TRANSMISSION EFFECTS</text>
  </g>

  <path d="M320 42 560 180v280L320 598 80 460V180Z"
        fill="none" stroke="#b7791f" stroke-width="18" stroke-linejoin="round"/>
</svg>
